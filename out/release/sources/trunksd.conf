description     "Chromium OS trunks daemon for TPM2.0"
author          "chromium-os-dev@chromium.org"

start on started boot-services and started dbus
stop on stopping boot-services and stopped chapsd
respawn

oom score -100

pre-start script
  mkdir -p /var/lib/trunks
  chown trunks:trunks /var/lib/trunks 2>/dev/null || true
end script

expect fork

# Use /dev/tpm0. On StarLite that node is the tpm2-simulator vtpm, because
# the kernel command line hides the unprovisioned hardware TPM. A second
# in-process simulator here is a different TPM from the one that sealed
# encstateful, and cryptohome then cannot mount.
exec trunksd

post-start script
  /usr/sbin/trunks_client --init_tpm || logger -t trunksd "init_tpm failed"
end script
