# StarLite: load display accelerometer (MXC6655 or KIOX000A) for Ash auto-rotate
start on started boot-services
task
script
  modprobe industrialio 2>/dev/null || true
  modprobe kfifo_buf 2>/dev/null || true
  modprobe industrialio-triggered-buffer 2>/dev/null || true
  # Memsic path
  modprobe iio-trig-hrtimer 2>/dev/null || true
  modprobe mxc4005 2>/dev/null || true
  # Kionix path (some StarLite units)
  modprobe kxcjk-1013 2>/dev/null || true
  modprobe kionix-kx022a-i2c 2>/dev/null || true
end script
